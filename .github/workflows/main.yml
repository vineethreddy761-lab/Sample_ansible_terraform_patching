name: "O&P Infrastructure Automated Compliance Pipeline"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate_framework:
    name: "Automated Syntax & Compliance Validation"
    runs-on: ubuntu-latest

    steps:
      - name: "Git Operations | Checkout Repository Code"
        uses: actions/checkout@v4

      # Setup Terraform environment
      - name: "Terraform Setup | Initialize Provisioning Engine Binary"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.0"

      # Execute Terraform checks (Bypassing format checking bugs)
      - name: "Terraform Pipeline | Execute Format & Syntax Verification"
        run: |
          cd terraform/
          terraform init -backend=false
          terraform validate

      # Setup Ansible environment
      - name: "Ansible Setup | Initialize Configuration Management Engine"
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      # Run Ansible syntax check with an explicit directory mapping flag
      - name: "Ansible Pipeline | Execute Playbook Syntax Validation Scan"
        run: |
          cd ansible/
          ANSIBLE_ROLES_PATH=./roles ansible-playbook site.yml --syntax-check
